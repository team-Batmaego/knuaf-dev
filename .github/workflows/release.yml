name: release
# 태그를 달면 맥용 설치본을 만들어 GitHub Releases에 **초안(draft)**으로 올린다.
# 초안인 이유: 서명이 없는 동안에는 사람이 받아서 한 번 열어보고 공개해야 한다.
#
# 서명·공증은 Apple Developer 계정이 생기면 저장소 시크릿만 넣으면 켜진다
# (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).
# 없으면 electron-builder가 서명을 건너뛰고 after-sign.mjs가 임시(ad-hoc) 서명만 한다.
# 그 빌드는 Gatekeeper가 막으므로 릴리스 본문에 해제 방법을 함께 싣는다.
#
# Windows 설치본(NSIS)은 아래 `windows` job 이 만든다 — W1 에서 윈도우 e2e 가 초록이 된 뒤
# 추가했다. 서명 인증서가 없어(형님 결정) 서명 설정·시크릿을 쓰지 않는다. 처음 실행의
# SmartScreen 경고는 docs/설치-안내-Windows.md 안내로 넘긴다.
# 태그 배포 **전용**이다. 설치본이 만들어지는지 확인만 하려면 `.github/workflows/
# build-installers.yml`(workflow_dispatch 전용, 비밀값·서명·공증 없음)을 쓴다 —
# 이 워크플로를 브랜치에서 수동 실행하면 서명·공증 자격이 쓰일 수 있기 때문이다(W2-R1-01).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 태그 커밋이 main CI 에서 '같은 시험'을 이미 초록으로 통과했는지 본다. 기록이 온전하면 아래
  # `verify`(맥 pytest·typecheck·build·맥 e2e)와 `e2e-windows`(윈도 e2e 5샤드)를 건너뛰고
  # 빌드·서명·체크섬·판 확인·초안만 돈다 — v0.7.2 태그 한 번이 2시간 35분이었고 그중 2시간 16분이
  # main 에서 이미 돈 시험의 중복이었다.
  #
  # 판정은 fail-closed 다: 기록이 없거나, 다른 커밋이거나, 실패·취소·건너뜀 작업이 하나라도
  # 있거나(문서만 바뀐 실행의 e2e 는 skipped 다), 조회가 실패하면 예전처럼 전부 돈다.
  # 재실행(attempt 2 이상)으로 초록이 된 실행도 근거로 인정한다 — 끄려면 저장소 변수
  # `RELEASE_CI_EVIDENCE_ACCEPT_RERUNS=false`(기본값: 인정).
  evidence:
    runs-on: ubuntu-latest
    # 조회가 매달리면 릴리스 전체가 늦어진다 — 이 작업은 몇 초짜리다.
    timeout-minutes: 5
    # 이 작업이 죽어도(네트워크·설치 실패) 릴리스가 막히지 않는다 — 판정 스크립트는 조회 실패를
    # 스스로 닫고 `skip=false` 로 끝나고(단계 continue-on-error), 이 작업 자체가 실패해도 아래
    # `verify` 는 `!cancelled()` 조건이라 그대로 시험을 돈다.
    permissions:
      # checkout 이 저장소를 읽고(contents), 판정은 실행·작업 목록만 읽는다(actions).
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.judge.outputs.skip }}
      # 판정 단계 자체가 성공했는지. `skip` 만 믿지 않는 이유: 판정 스크립트는 요약 쓰기 → 출력
      # 쓰기 순서로 남기므로 요약이 실패하면 `skip=true` 가 남지 않지만, 그 반대(출력만 남고
      # 단계 실패)를 워크플로가 논리로도 막는다 — 아래 조건들은 이 값이 'true' 일 때만 건너뛴다.
      valid: ${{ steps.judge.outcome == 'success' }}
      run_number: ${{ steps.judge.outputs.run_number }}
      run_attempt: ${{ steps.judge.outputs.run_attempt }}
      run_url: ${{ steps.judge.outputs.run_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 이 단계는 릴리스 자체를 막지 않는다. 실패하면 출력이 비어 `skip != 'true'` 가 되어
      # 아래 시험 작업이 그대로 돈다(옛 태그처럼 판정 스크립트가 없는 커밋도 같은 길로 간다).
      - name: 태그 커밋의 main CI 기록 판정
        id: judge
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CI_EVIDENCE_ACCEPT_RERUNS: ${{ vars.RELEASE_CI_EVIDENCE_ACCEPT_RERUNS }}
        run: node app/scripts/release-ci-evidence.mjs

  # ci.yml 은 push 트리거가 브랜치 한정(`branches: ["main", "release/**"]`)이라 태그 푸시에는 돌지 않는다.
  # 위 `evidence` 가 태그 커밋의 main CI 초록 기록을 찾지 못했을 때만 여기서 다시 돈다. 맥 e2e 도
  # 윈도 e2e 도 여기서 돈다 - ci.yml 의 e2e 는 PR·main push 를 덮지만 태그 커밋은 그 어느 쪽도
  # 아니므로 아래 `e2e-windows` 가 태그 경로의 윈도 몫을 맡는다.
  verify:
    needs: evidence
    # `if:` 를 적으면 암묵 `success()` 가 빠진다 — 그래서 `evidence` 작업이 실패(조회는 스크립트가
    # 스스로 닫지만 체크아웃·런너 실패는 있다)해도 이 작업은 돈다. 건너뛰기는 세 가지가 모두
    # 맞을 때만이다: evidence 작업 성공 · 판정 단계 성공(`valid`) · `skip=true`. 출력만 남고
    # 판정이 실패한 경우(I-01)에는 `valid` 가 'false' 라 여기서 그대로 시험을 돈다.
    if: ${{ !cancelled() && !(needs.evidence.result == 'success' && needs.evidence.outputs.valid == 'true' && needs.evidence.outputs.skip == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/skill-source.json
      - run: python -m pip install -r "$(node app/scripts/fetch-skill.mjs --requirements)" pytest pytest-timeout
      - run: node app/scripts/stage-skill.mjs --python python
      - run: python -m pytest
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm typecheck
        working-directory: app
      - run: pnpm build
        working-directory: app
      # xlsx-preview.spec.ts 는 Playwright 의 headless Chromium 셸로 실제 화면을 띄운다.
      # 러너 이미지에는 브라우저가 없어서, 이 단계가 없으면 태그 실행이 여기서 죽는다
      # (v0.6.0 release 42464591854 — "Executable doesn't exist at …/chrome-headless-shell").
      # ci.yml 과 같은 캐시 키를 써서 브랜치 CI 가 받아 둔 브라우저를 그대로 재사용한다.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium headless shell
        working-directory: app
        run: pnpm exec playwright install chromium --only-shell
      - run: pnpm exec playwright test --grep-invert "screenshots|real window capture"
        working-directory: app
        env:
          # 맨이름은 안 된다 — 앱이 existsSync 로 걸러 조용히 폴백하고, PATH 를 좁히는
          # 스펙에서 macOS 기본 3.9 를 집어 project:open 이 실패한다(ci.yml 과 같은 수정).
          KNUAF_PYTHON: ${{ env.pythonLocation }}/bin/python

  # 태그 경로의 윈도 e2e 관문. ci.yml 은 PR·main push 에서 윈도 e2e 를 돌지만 태그 커밋은 그
  # 트리거에 걸리지 않으므로(브랜치 한정 push) `evidence` 가 기록을 못 찾았을 때 여기서 한 번 더
  # 돈다 — 초안을 만드는 `macos` 와 설치본을 올리는 `windows` 가 이 작업의 성공을 `needs` 로
  # 기다린다. 즉 윈도 e2e 가 빨개지면 초안 자체가 생기지 않는다. PR 에서 이미 같은 시험을
  # 돌았더라도 태그 커밋은 PR 커밋과 다를 수 있으므로(머지 커밋) `evidence` 가 태그 커밋의
  # main CI 초록 기록을 확인해 주지 못하면 중복이 아니라 재확인이다.
  # 대가: 태그 1회당 러너 ~36분(5샤드 병렬) + 설치본 작업 대기. 근거 기록이 있는 태그는 0분 —
  # 그때는 위 `verify` 가 건너뛰어지고, 이 작업은 의존 작업이 건너뛰었으므로 함께 건너뛴다.
  e2e-windows:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: app/resources/skill-upstreams
          key: ${{ runner.os }}-skill-${{ hashFiles('app/skill-source.json') }}
      - run: python -m pip install -r "$(node scripts/fetch-skill.mjs --requirements)" pytest pytest-timeout
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --only-shell
      # 묶음표를 태그 경로에서도 대조한다 — PR 경로와 같은 두 검사(--check, --verify-discovery).
      - run: node scripts/e2e-shards.mjs --check
      - run: node scripts/e2e-shards.mjs --verify-discovery windows
        if: matrix.shard == 1
      - name: e2e (Windows, ${{ matrix.shard }})
        run: node scripts/e2e-shards.mjs windows ${{ matrix.shard }}
        env:
          # ci.yml 과 같은 이유로 절대 경로여야 한다(맨이름은 앱이 existsSync 로 걸러 폴백한다).
          KNUAF_PYTHON: ${{ env.pythonLocation }}\python.exe
          KNUAF_SHOT_DIR: test-results/ui-shots
      - name: e2e failure traces (Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-artifacts-windows-${{ matrix.shard }}
          path: app/test-results/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

  macos:
    needs: [evidence, verify, e2e-windows]
    # 두 갈래로만 돈다: (가) `evidence` 가 태그 커밋의 main CI 초록 기록을 증명해 위 시험을
    # 건너뛴 경우, (나) 시험을 실제로 돌았고 둘 다 성공한 경우. 의존 작업이 '건너뜀'이면 여기서도
    # 건너뛰므로 조건을 명시한다 — 시험이 실패·취소된 태그로 초안이 만들어지면 안 된다.
    # (가)는 evidence 작업 성공 · 판정 단계 성공(`valid`) · `skip=true` 를 모두 요구한다 — 출력만
    # 남고 판정이 실패한 경우(I-01)에 시험을 생략하지 않는다.
    if: ${{ !cancelled() && ((needs.evidence.result == 'success' && needs.evidence.outputs.valid == 'true' && needs.evidence.outputs.skip == 'true') || (needs.verify.result == 'success' && needs.e2e-windows.result == 'success')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 버전이 네 군데(태그·app/package.json·두 plugin.json)에 흩어져 있고 일치를
      # 확인하는 장치가 없었다. 어긋난 채 배포하면 학생이 받은 앱과 스킬 버전이 달라진다.
      - name: 태그와 선언된 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for f in app/package.json .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            got=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['version'])" "$f")
            [ "$got" = "$tag" ] || { echo "::error file=$f::버전 불일치 — 태그 $tag / 파일 $got"; fail=1; }
          done
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r "$(node app/scripts/fetch-skill.mjs --requirements)" pytest pytest-timeout

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # dist:mac = build → prepare:resources(번들 CPython·휠하우스·아이콘·안내 PDF·스킬) → electron-builder.
      # PBS_SHA256 은 선택이다. 없으면 fetch-python.mjs 가 릴리스의 SHA256SUMS 를 받아 대조한다.
      #
      # 출시 설치본에는 운영 채널·운영 공개키만 들어간다. 내부 시험용 빌드 값이 이 빌드 환경이나
      # 출시 워크플로에 섞여 있으면 빌드 전에 멈춘다(`app/scripts/check-release-update-config.mjs`).
      - name: 업데이트 채널 설정 확인 (빌드 전)
        working-directory: app
        run: node scripts/check-release-update-config.mjs --env --workflows
      # 서명 자격을 "있을 때만" 내보낸다. 시크릿이 없으면 ${{ }} 가 빈 문자열로 펼쳐지고,
      # env: 에 그대로 쓰면 CSC_LINK 가 "정의됐지만 빈 값"이 된다. electron-builder 는
      # 정의된 CSC_LINK 를 인증서 파일 경로로 읽으므로 빈 값은 작업 디렉터리로 풀려
      #   ⨯ .../app not a file
      # 로 죽는다. 로컬에서는 변수 자체가 없어 정상 통과하던 것이 CI 에서만 터졌다.
      - name: 설치본 빌드
        working-directory: app
        run: |
          if [ -n "$IN_CSC_LINK" ]; then export CSC_LINK="$IN_CSC_LINK"; fi
          if [ -n "$IN_CSC_KEY_PASSWORD" ]; then export CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD"; fi
          if [ -n "$IN_APPLE_ID" ]; then export APPLE_ID="$IN_APPLE_ID"; fi
          if [ -n "$IN_APPLE_APP_SPECIFIC_PASSWORD" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD"; fi
          if [ -n "$IN_APPLE_TEAM_ID" ]; then export APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"; fi
          pnpm dist:mac
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 무료 중계(DS·GLM) 출입증. 저장소가 공개라 값은 소스에 없고 여기(태그 릴리스)에서만
          # 빌드 환경으로 들어간다. `electron.vite.config.ts` 가 메인 define 으로 접어 넣는다.
          KNUAF_FREE_RELAY_TOKEN: ${{ secrets.KNUAF_FREE_RELAY_TOKEN }}

      # C-01: 근거를 보고 `verify` 를 건너뛰면 `verify` 가 pytest 직전에 하던 **오프라인 재스테이징**
      # 만 태그 경로에서 사라진다. CI 의 pytest 는 `KNUAF_TEST_SCRIPTS_DIR` 를 줘서 그 훅을 건너뛰므로
      # (app/scripts/test-with-skill.mjs) main CI 초록 기록은 그 경로를 증명하지 않는다.
      # `verify` 와 같은 방식으로 `stage-skill.mjs --offline` 을 한 번 돌린다 - 바로 위 설치본 빌드
      # (dist:mac -> stage:skill)가 핀 소스를 캐시에 채웠으므로, 캐시만으로 같은 번들이 다시 만들어지고
      # 호환 시험까지 통과하는지(= tests/conftest.py 의 pytest_sessionstart 가 하는 일)를 본다.
      # 실패하면 릴리스는 여기서 멈춘다(초안 없음). 비용: 스테이징 1회 약 2분06초(맥 실측,
      # app/scripts/verify-skill-staging.mjs 머리말) — 건너뛰기로 아끼는 2시간 16분에 비해 작다.
      # 시험을 직접 돈 실행(verify 가 오프라인 경로 그대로 돌았다)에서는 중복이므로 돌리지 않는다.
      # `success()` 를 명시해 둔다 — 암묵으로 붙는 것과 뜻이 같지만, 빌드가 실패한 판에서 2분짜리
      # 확인까지 돌지 않는다는 의도를 읽는 사람에게 분명히 남긴다.
      - name: 스킬 오프라인 재스테이징 확인 (건너뛴 실행의 pytest 준비 대체)
        if: ${{ success() && needs.evidence.result == 'success' && needs.evidence.outputs.valid == 'true' && needs.evidence.outputs.skip == 'true' }}
        working-directory: app
        run: node scripts/stage-skill.mjs --offline --python python

      # 만들어진 번들과 포장된 app.asar 를 바이트로 본다: 운영 채널 주소와 운영 공개키 2개가 있고
      # 내부 시험용 빌드의 표식·같은 PC 채널 주소·다른 키가 없어야 한다. 올리기 전에 돈다.
      - name: 업데이트 채널 설정 확인 (산출물)
        working-directory: app
        run: |
          args=(--out out)
          for asar in dist/mac*/*.app/Contents/Resources/app.asar; do
            [ -f "$asar" ] || { echo "::error::app.asar 를 찾지 못했습니다"; exit 1; }
            args+=(--asar "$asar")
          done
          node scripts/check-release-update-config.mjs "${args[@]}"
      # 무료 모델은 이 출입증이 설치본에 박혀야만 뜬다. 값이 비면 앱은 조용히 '무료 회사 없음'으로
      # 동작하므로(설계상 정상) 릴리스가 멀쩡해 보인다 — 그래서 빌드가 스스로 확인하고 죽는다.
      # 값을 로그에 찍지 않는다(grep -q / Contains 만 쓴다).
      - name: 무료 중계 출입증 주입 확인
        working-directory: app
        env:
          IN_TOKEN: ${{ secrets.KNUAF_FREE_RELAY_TOKEN }}
        run: |
          if [ -z "${IN_TOKEN:-}" ]; then
            echo "::error::KNUAF_FREE_RELAY_TOKEN 시크릿이 비어 있습니다 - 무료 모델이 전부 막힌 설치본이 나갑니다"
            exit 1
          fi
          if [ ! -f out/main/index.js ]; then
            echo "::error::out/main/index.js 가 없습니다"; exit 1
          fi
          if grep -qF '__KNUAF_FREE_TOKEN__' out/main/index.js; then
            echo "::error::메인 묶음에 define 식별자가 남았습니다(치환 실패)"; exit 1
          fi
          asar=$(find dist -name app.asar -print -quit)
          if [ -z "$asar" ]; then echo "::error::app.asar 를 찾지 못했습니다"; exit 1; fi
          node -e 'const fs = require("node:fs"); const token = process.env.IN_TOKEN; const files = process.argv.slice(1); const contains = (path) => fs.statSync(path).isDirectory() ? fs.readdirSync(path).some((name) => contains(`${path}/${name}`)) : fs.readFileSync(path).includes(token); if (!contains(files[0])) { console.error("::error::출입증이 메인 묶음(app.asar)에 없습니다 - define 이 빌드에 전달되지 않았습니다"); process.exit(1); } for (const dir of files.slice(1)) { if (contains(dir)) { console.error(`::error::${dir} 에 출입증이 들어갔습니다(화면 번들 유출)`); process.exit(1); } }' "$asar" out/renderer out/preload
          for d in out/renderer out/preload; do
            if grep -rqE 'kf1_[A-Za-z0-9_-]{43}' "$d" || grep -rqF '__KNUAF_FREE_TOKEN__' "$d"; then
              echo "::error::$d 에 출입증이 들어갔습니다(화면 번들 유출)"; exit 1
            fi
          done
          echo "출입증 확인: app.asar 메인에 주입됨, out/renderer·out/preload 엔 없음 ($(basename "$asar"))"

      # 서명이 실제로 붙었는지 기록에 남긴다. adhoc 이면 릴리스 본문이 해제 안내를 달고,
      # 정식 서명이면 그 문단을 뺀다 — 안내가 사실과 어긋나지 않게 빌드가 직접 판정한다.
      - name: 서명 상태 확인
        id: sign
        working-directory: app
        run: |
          app=$(find dist -maxdepth 2 -name "*.app" -print -quit)
          echo "검사 대상: $app"
          codesign -dv "$app" 2>&1 | tee /tmp/codesign.txt || true
          if grep -q "Signature=adhoc" /tmp/codesign.txt; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          spctl -a -vv "$app" 2>&1 || true

      - name: 체크섬 생성
        working-directory: app/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - name: 릴리스 초안 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          # 초안 기록도 시험 생략과 같은 세 조건으로 판정한다 — 원시 `skip` 만 읽으면 evidence 잡이
          # 최종 실패해 시험을 실제로 돈 판에서도 '건너뛰었다'고 잘못 적힌다(Roh A 2차 I-01).
          SKIP_TESTS: ${{ needs.evidence.result == 'success' && needs.evidence.outputs.valid == 'true' && needs.evidence.outputs.skip == 'true' }}
          EVIDENCE_RUN: ${{ needs.evidence.outputs.run_number }}
          EVIDENCE_URL: ${{ needs.evidence.outputs.run_url }}
        working-directory: app/dist
        run: |
          {
            echo "> [!WARNING]"
            echo "> **초기 베타입니다.** 아직 실사용 검증이 충분하지 않습니다."
            echo "> 실제 제출용 논문에 쓰시기 전에 원본 답변·자료를 따로 백업해 두세요."
            echo
            echo "## 설치"
            echo
            echo "\`.dmg\` 를 내려받아 여세요."
            echo
            if [ "$SIGNED" != "true" ]; then
              cat ../../docs/설치-안내-macOS.md
            fi
            echo
            echo "## 확인"
            echo
            echo "이 빌드는 서명 상태를 빌드가 직접 판정해 기록합니다 — 정식 서명: \`$SIGNED\`."
            echo "파일 무결성은 \`SHA256SUMS-macos.txt\`(macOS)·\`SHA256SUMS-windows.txt\`(Windows) 로 확인할 수 있습니다."
            echo
            echo "## 시험"
            echo
            if [ "$SKIP_TESTS" = "true" ]; then
              echo "이 태그 커밋은 main CI 에서 같은 시험(pytest 3.13·typecheck·build·e2e 맥 2·윈도 5 샤드)을 이미 통과했습니다 — 근거: [CI 실행 #$EVIDENCE_RUN]($EVIDENCE_URL)."
              echo "이번 실행은 설치본 빌드·서명·체크섬·판 확인·초안 단계와, CI 가 덮지 않는 스킬 오프라인 재스테이징 확인만 돌았습니다."
            else
              echo "이 태그 커밋의 main CI 초록 기록을 근거로 쓰지 못해, 이 워크플로가 시험을 직접 돌렸습니다(맥 pytest·typecheck·build·e2e, 윈도 e2e 5샤드)."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            *.dmg *.zip SHA256SUMS-macos.txt

  # 윈도우 설치본(NSIS, 서명 없음). 맥 job 과 같은 트리거·같은 조건(시험 성공 또는 시험 건너뜀) 뒤에 돈다.
  # dist:win = build → prepare:resources(번들 CPython·휠하우스·아이콘·안내 PDF·스킬) →
  # electron-builder --win. fetch:python 은 PBS_TARGET 기본값이 x86_64-pc-windows-msvc 이고,
  # build:wheelhouse 는 번들 python.exe 로 win_amd64 휠을 받는다(pywin32 포함).
  windows:
    needs: [evidence, verify, e2e-windows]
    if: ${{ !cancelled() && ((needs.evidence.result == 'success' && needs.evidence.outputs.valid == 'true' && needs.evidence.outputs.skip == 'true') || (needs.verify.result == 'success' && needs.e2e-windows.result == 'success')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 맥 job 과 같은 확인 — 버전이 네 군데 흩어져 있다.
      - name: 태그와 선언된 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $fail = 0
          foreach ($f in @('app/package.json', '.claude-plugin/plugin.json', '.codex-plugin/plugin.json')) {
            $got = python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['version'])" $f
            if ($got -ne $tag) { Write-Host "::error file=$f::버전 불일치 — 태그 $tag / 파일 $got"; $fail = 1 }
          }
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # 위 버전 확인용 python. 번들 런타임(3.12)은 fetch:python 이 따로 받는다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r "$(node app/scripts/fetch-skill.mjs --requirements)" pytest pytest-timeout

      - run: pnpm install --frozen-lockfile
        working-directory: app
      # 출시 설치본에는 운영 채널·운영 공개키만 들어간다. 내부 시험용 빌드 값이 이 빌드 환경이나
      # 출시 워크플로에 섞여 있으면 빌드 전에 멈춘다(`app/scripts/check-release-update-config.mjs`).
      - name: 업데이트 채널 설정 확인 (빌드 전)
        working-directory: app
        run: node scripts/check-release-update-config.mjs --env --workflows
      # 서명 없음 — CSC_*/APPLE_* 를 넘기지 않는다(formac job 과 달리 env 자체가 없다).
      - name: 설치본 빌드
        working-directory: app
        run: pnpm dist:win
        env:
          # 무료 중계 출입증 — 맥 job 과 같은 이유로 빌드 환경에만 넣는다.
          KNUAF_FREE_RELAY_TOKEN: ${{ secrets.KNUAF_FREE_RELAY_TOKEN }}
      - name: Verify staged skill against signed channel manifest
        working-directory: app
        run: node scripts/verify-skill-staging.mjs

      # 만들어진 번들과 포장된 app.asar 를 바이트로 본다: 운영 채널 주소와 운영 공개키 2개가 있고
      # 내부 시험용 빌드의 표식·같은 PC 채널 주소·다른 키가 없어야 한다. 올리기 전에 돈다.
      - name: 업데이트 채널 설정 확인 (산출물)
        working-directory: app
        run: node scripts/check-release-update-config.mjs --out out --asar dist/win-unpacked/resources/app.asar
      # 맥 job 과 같은 검사(출입증이 설치본 메인에 박혔는지, 화면 번들엔 없는지).
      # 값을 로그에 찍지 않는다 - Select-String/-Contains 의 참·거짓만 쓴다.
      - name: 무료 중계 출입증 주입 확인
        working-directory: app
        shell: pwsh
        env:
          IN_TOKEN: ${{ secrets.KNUAF_FREE_RELAY_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:IN_TOKEN)) {
            Write-Host "::error::KNUAF_FREE_RELAY_TOKEN 시크릿이 비어 있습니다 - 무료 모델이 전부 막힌 설치본이 나갑니다"
            exit 1
          }
          $main = 'out/main/index.js'
          if (-not (Test-Path $main)) { Write-Host "::error::$main 가 없습니다"; exit 1 }
          if ((Get-Content -Raw $main).Contains('__KNUAF_FREE_TOKEN__')) {
            Write-Host "::error::메인 묶음에 define 식별자가 남았습니다(치환 실패)"; exit 1
          }
          $asar = Get-ChildItem -Path dist -Filter app.asar -Recurse -File | Select-Object -First 1
          if (-not $asar) { Write-Host "::error::app.asar 를 찾지 못했습니다"; exit 1 }
          $bytes = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($asar.FullName))
          if (-not $bytes.Contains($env:IN_TOKEN)) {
            Write-Host "::error::출입증이 메인 묶음(app.asar)에 없습니다 - define 이 빌드에 전달되지 않았습니다"; exit 1
          }
          foreach ($d in @('out/renderer', 'out/preload')) {
            $hit = Get-ChildItem -Path $d -Recurse -File | Where-Object {
              $t = Get-Content -Raw -LiteralPath $_.FullName -ErrorAction SilentlyContinue
              $null -ne $t -and ($t.Contains($env:IN_TOKEN) -or $t.Contains('__KNUAF_FREE_TOKEN__') -or $t -match 'kf1_[A-Za-z0-9_-]{43}')
            } | Select-Object -First 1
            if ($hit) { Write-Host "::error::$d 에 출입증이 들어갔습니다(화면 번들 유출): $($hit.Name)"; exit 1 }
          }
          Write-Host "출입증 확인: app.asar 메인에 주입됨, out/renderer·out/preload 엔 없음"

      - name: 체크섬 생성
        working-directory: app/dist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.exe -File
          if (-not $files) { Write-Error "설치본(*.exe)이 만들어지지 않았습니다"; exit 1 }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$h  $($f.Name)"
          }
          # 맥 체크섬(`SHA256SUMS-macos.txt`)을 덮어쓰지 않도록 이름을 나눈다(W2-R1-02).
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      # 설치본이 실제로 만들어졌는지 아티팩트로 확인한다(workflow_dispatch 로도 돌 수 있다).
      - name: 설치본 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            app/dist/*.exe
            app/dist/SHA256SUMS-windows.txt
          if-no-files-found: warn
          retention-days: 14

      # 맥 job 이 초안을 만든다(두 job 은 병렬이다). 초안이 나타난 뒤 자산만 더한다.
      - name: 릴리스 초안에 설치본 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app/dist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag --json isDraft 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { Write-Error "초안 릴리스가 10분 안에 나타나지 않았습니다 ($tag)"; exit 1 }
          gh release upload $tag *.exe SHA256SUMS-windows.txt --clobber
